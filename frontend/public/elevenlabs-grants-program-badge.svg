<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none">
  <!-- ElevenLabs || Mark + Wordmark -->
  <g transform="translate(18, 20)">
    <!-- Iconic || Bars -->
    <rect x="0" y="3" width="5.5" height="26" rx="1.5" fill="#ffffff"/>
    <rect x="10" y="3" width="5.5" height="26" rx="1.5" fill="#ffffff"/>
    <!-- Wordmark -->
    <text x="24" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.5">ElevenLabs</text>
  </g>

  <!-- Divider -->
  <line x1="162" y1="18" x2="162" y2="54" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Program Name -->
  <text x="176" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Grants</text>
  <text x="176" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9ca3af" letter-spacing="1.5">RECIPIENT</text>
</svg>
